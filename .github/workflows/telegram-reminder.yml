name: Telegram reminder

"on":
  schedule:
    - cron: "45 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send immediately"
        required: false
        default: "true"

concurrency:
  group: telegram-reminder
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REMINDER_TEXT: ${{ vars.TELEGRAM_REMINDER_TEXT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          text = os.environ.get("TELEGRAM_REMINDER_TEXT") or "TEST SCHEDULE WORKS"

          now = datetime.now(timezone.utc)

          payload = {
              "chat_id": chat_id,
              "text": f"Scheduled test OK\nUTC: {now:%H:%M}",
              "disable_notification": False
          }

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              print(r.read().decode())
          PY
